name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential postgresql-server-dev-16

      - name: Install clang-19
        run: |
          sudo apt-get install -y clang-19

      - name: Build extension
        run: |
          make

  # Proves the extension installs into a real cluster and can generate text
  # end to end: tokenizer, embeddings, forward pass, sampling and decoding.
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential postgresql-16 postgresql-server-dev-16

      - name: Install the clang PGXS builds bitcode with
        # PGXS emits LLVM bitcode for JIT inlining using the exact clang
        # recorded in Makefile.global. Without it `make` fails after the shared
        # library has already linked, so read the version rather than pinning
        # one that only happens to match today's runner image.
        run: |
          makefile_global="$(pg_config --pgxs | sed 's#/makefiles/pgxs\.mk$#/Makefile.global#')"
          clang_bin="$(sed -n 's/^CLANG = *//p' "$makefile_global")"
          if [ -n "$clang_bin" ] && [ ! -x "$clang_bin" ]; then
            sudo apt-get install -y "$(basename "$clang_bin")"
          fi
          "$(basename "${clang_bin:-clang}")" --version

      - name: Build and install the extension
        run: |
          make
          sudo make install

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql@16-main || sudo pg_ctlcluster 16 main start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb pg_gpt2_ci

      - name: Create the extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d pg_gpt2_ci \
            -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pg_llm;'

      - name: Install Python dependencies
        run: python -m pip install --upgrade "psycopg[binary]" numpy

      - name: Run the generation smoke test
        run: |
          python scripts/smoke_test.py \
            --dsn "postgresql://postgres:postgres@localhost:5432/pg_gpt2_ci"

  endpoint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install endpoint dependencies
        run: python -m pip install --upgrade -r server/requirements.txt

      - name: Import the application
        # Catches syntax errors and bad imports in the HTTP layer without
        # needing a database.
        run: python -c "from server.app import app; print(app.title, app.version)"
